name: Bug report
description: Report a reproducible problem in a helper, manifest, or instruction.
title: "[bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the smallest safe reproduction. Do not include secrets or customer data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skill or release version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, personal data, and confidential material.
          required: true

